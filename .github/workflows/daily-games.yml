name: Daily Game Deals Sync & Notify

on:
  schedule:
    # 台灣時間 (UTC+8) 每天 10:00 與 20:00 執行
    - cron: '0 2,12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '設為 true 時僅模擬執行，不實際發送 LINE 推播'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run game sync & deal notification worker
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TARGET_FIREBASE_UID: ${{ secrets.TARGET_FIREBASE_UID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          PSN_WISHLIST_SHA256: ${{ secrets.PSN_WISHLIST_SHA256 }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: npm run worker:games
